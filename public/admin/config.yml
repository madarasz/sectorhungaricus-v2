# Production backend
# backend:
#   name: git-gateway
#   branch: main

# Local development backend
backend:
  name: test-repo

local_backend: true

media_folder: public/uploads
public_folder: /uploads

i18n:
  structure: multiple_files
  locales: [en, hu]
  default_locale: en

collections:
  - name: "games"
    label: "Games"
    folder: "content/games"
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - {label: "Title", name: "title", widget: "string", i18n: true}
      - {label: "Description", name: "description", widget: "text", i18n: true}
      - {label: "Order", name: "order", widget: "number", default: 1, i18n: "duplicate"}
      - {label: "Featured Image", name: "featuredImage", widget: "image", required: false}

  - name: "pages"
    label: "Pages"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - {label: "Title", name: "title", widget: "string", i18n: true}
      - {label: "Slug", name: "slug", widget: "string"}
      - {label: "SEO Title", name: "metaTitle", widget: "string", i18n: true, required: false, hint: "Overrides the <title> tag and social share title. Leave empty to use the page title."}
      - {label: "SEO Description", name: "metaDescription", widget: "text", i18n: true, required: false, hint: "Meta description shown in search results (~155 characters)."}
      - {label: "Hero", name: "hero", widget: "markdown", i18n: true, required: false}
      - {label: "Body", name: "body", widget: "markdown", i18n: true}

  - name: "galleries"
    label: "Galleries"
    folder: "content/galleries"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text", required: false}
      - label: "Images"
        name: "images"
        widget: "list"
        fields:
          - {label: "Image", name: "src", widget: "image"}
          - {label: "Caption", name: "caption", widget: "string", required: false}
          - {label: "Alt Text", name: "alt", widget: "string"}

  - name: "artists"
    label: "Artists"
    folder: "content/artists"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Portfolio URL", name: "portfolio", widget: "string", required: false}
      - {label: "Does Commission", name: "does_commission", widget: "boolean", default: false}
      - label: "Gallery"
        name: "gallery"
        widget: "relation"
        collection: "galleries"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: true

  - name: "tournaments"
    label: "Tournaments"
    folder: "content/tournaments"
    create: true
    slug: "{{slug}}"
    i18n: false
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - label: "Game"
        name: "game"
        widget: "relation"
        collection: "games"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        required: true
      - {label: "Url", name: "url", widget: "string"}

  - name: "killteams"
    label: "Kill Teams"
    folder: "content/killteams"
    create: true
    slug: "{{slug}}"
    i18n: true
    summary: "{{name}} ({{tier}})"
    view_filters:
      - {label: "Reviewed", field: "reviewed", pattern: ".+"}
      - {label: "Not reviewed", field: "reviewed", pattern: "^$"}
    fields:
      - {label: "Name", name: "name", widget: "string", i18n: "duplicate"}
      - {label: "Reviewed by", name: "reviewed", widget: "string", required: false, i18n: "duplicate", hint: "Nickname of the person who checked this team information. Not shown on the site."}
      - label: "Factions"
        name: "factions"
        widget: "select"
        multiple: true
        i18n: "duplicate"
        hint: "Values must match the faction options of the Kill Team Chooser block."
        options: ["imperium", "chaos", "xenos", "baseline-human", "space-marine", "astra-militarum", "adepta-sororitas", "inquisition", "abhuman", "mutant", "adeptus-mechanicus", "aeldari", "tyranid", "genestealer-cult", "necron", "tau", "votann", "ork"]
      - {label: "Operatives", name: "operatives", widget: "number", value_type: "int", required: false, i18n: "duplicate", hint: "Fix number of operatives. Leave empty if the team size is a range."}
      - {label: "Operatives minimum", name: "operatives_min", widget: "number", value_type: "int", required: false, i18n: "duplicate", hint: "Used when Operatives is empty"}
      - {label: "Operatives maximum", name: "operatives_max", widget: "number", value_type: "int", required: false, i18n: "duplicate", hint: "Used when Operatives is empty"}
      - {label: "Boxes to buy", name: "boxes", widget: "number", value_type: "int", min: 1, max: 3, i18n: "duplicate"}
      - {label: "Boxes note", name: "boxes_note", widget: "string", required: false, i18n: true}
      - label: "Power tier"
        name: "tier"
        widget: "select"
        required: false
        default: ""
        i18n: "duplicate"
        options:
          - {label: "No tier", value: ""}
          - {label: "S", value: "S"}
          - {label: "A", value: "A"}
          - {label: "B", value: "B"}
          - {label: "C", value: "C"}
          - {label: "D", value: "D"}
          - {label: "E", value: "E"}
      - {label: "Beginner-friendly", name: "beginner_friendly", widget: "boolean", i18n: "duplicate"}
      - label: "Combat (3 icons)"
        name: "combat"
        widget: "list"
        min: 3
        max: 3
        hint: "Add exactly 3 icons, e.g. ranged, ranged, melee. Same for all languages."
        field: {label: "Icon", name: "icon", widget: "select", options: ["ranged", "melee"]}
      - {label: "Tournament legal until (year)", name: "legal_until", widget: "number", value_type: "int", required: false, i18n: "duplicate", hint: "The team is tournament legal until 30 November of this year. Empty means not tournament legal (non-classified)."}
      - {label: "Image", name: "image", widget: "image", required: false, i18n: "duplicate"}
      - {label: "Second image", name: "second_image", widget: "image", required: false, i18n: "duplicate", hint: "Shown next to the first image in the team details."}
      - {label: "Play style", name: "body", widget: "markdown", i18n: true}

  - name: "subpages"
    label: "Subpages"
    folder: "content/subpages"
    create: true
    slug: "{{game}}-{{fields.slug}}"
    i18n: true
    fields:
      - {label: "Title", name: "title", widget: "string", i18n: true}
      - {label: "Hide title", name: "hide-title", widget: "boolean", default: false, i18n: "duplicate"}
      - {label: "Slug", name: "slug", widget: "string", i18n: "duplicate"}
      - {label: "Order", name: "order", widget: "number", default: 1, i18n: "duplicate"}
      - {label: "SEO Title", name: "metaTitle", widget: "string", i18n: true, required: false, hint: "Overrides the <title> tag and social share title. Leave empty to use the page title."}
      - {label: "SEO Description", name: "metaDescription", widget: "text", i18n: true, required: false, hint: "Meta description shown in search results (~155 characters)."}
      - label: "Game"
        name: "game"
        widget: "relation"
        collection: "games"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
      - label: "Content Blocks"
        name: "content_blocks"
        widget: "list"
        i18n: true
        types:
          - label: "Text Block"
            name: "text_block"
            widget: "object"
            fields:
              - {label: "Content", name: "content", widget: "markdown"}
              - label: "Style"
                name: "style"
                widget: "select"
                options: ["normal", "bordered"]
                default: "normal"
          - label: "Hero Block"
            name: "hero_block"
            widget: "object"
            fields:
              - {label: "Content", name: "content", widget: "markdown"}
          - label: "Two Column Layout"
            name: "two_column_block"
            widget: "object"
            fields:
              - {label: "Block Title", name: "block_title", widget: "string"}
              - {label: "Hide title", name: "hide_title", widget: "boolean", default: false}
              - {label: "Left Content", name: "left_content", widget: "markdown"}
              - {label: "Right Content", name: "right_content", widget: "markdown"}
          - label: "Gallery Block"
            name: "gallery_block"
            widget: "object"
            fields:
              - label: "Gallery"
                name: "gallery"
                widget: "relation"
                collection: "galleries"
                search_fields: ["title"]
                value_field: "{{slug}}"
                display_fields: ["title"]
                required: false
          - label: "Page Reference Block"
            name: "page_reference_block"
            widget: "object"
            fields:
              - label: "Component Path"
                name: "page_reference"
                widget: "string"
                hint: "Enter the path to a .tsx component (e.g., 'pages/ContactForm' or 'custom/MyComponent'). Path should be relative to src/components/"
                pattern: ["^[a-zA-Z0-9/_-]+$", "Must contain only letters, numbers, forward slashes, underscores, and hyphens"]
                required: true
          - label: "Artist Block"
            name: "artist_block"
            widget: "object"
            fields:
              - label: "Artist"
                name: "artist"
                widget: "relation"
                collection: "artists"
                search_fields: ["name"]
                value_field: "{{slug}}"
                display_fields: ["name"]
                required: true
          - label: "Kill Team Chooser"
            name: "kill_team_chooser"
            widget: "object"
            fields:
              - label: "Labels"
                name: "labels"
                widget: "object"
                fields:
                  - {label: "Question: experience", name: "q_experience", widget: "string"}
                  - {label: "Answer: first team", name: "a_experience_new", widget: "string"}
                  - {label: "Answer: played before", name: "a_experience_played", widget: "string"}
                  - {label: "Question: fighting style", name: "q_fight", widget: "string"}
                  - {label: "Answer: ranged", name: "a_fight_ranged", widget: "string"}
                  - {label: "Answer: melee", name: "a_fight_melee", widget: "string"}
                  - {label: "Answer: mixed", name: "a_fight_mixed", widget: "string"}
                  - {label: "Question: team size", name: "q_size", widget: "string"}
                  - {label: "Answer: few elite (up to 6)", name: "a_size_few", widget: "string"}
                  - {label: "Answer: many (7-10)", name: "a_size_many", widget: "string"}
                  - {label: "Answer: horde (11+)", name: "a_size_horde", widget: "string"}
                  - {label: "Question: boxes", name: "q_boxes", widget: "string"}
                  - {label: "Checkbox: only one box", name: "a_boxes_one", widget: "string"}
                  - {label: "Question: tournament legality", name: "q_legal", widget: "string"}
                  - {label: "Checkbox: classified", name: "a_legal_classified", widget: "string"}
                  - {label: "Question: faction", name: "q_faction", widget: "string"}
                  - label: "Factions"
                    name: "factions"
                    widget: "list"
                    hint: "Labels of the faction tags. Main and sub faction grouping of the filter is set in the code."
                    fields:
                      - {label: "Value", name: "value", widget: "string"}
                      - {label: "Label", name: "label", widget: "string"}
                  - {label: "Result count", name: "result_count", widget: "string", hint: "Use {shown} and {total}"}
                  - {label: "Reset button", name: "reset", widget: "string"}
                  - {label: "Filters button (mobile)", name: "filters_button", widget: "string", hint: "Opens the questions on mobile. Also the title of the questions panel."}
                  - {label: "Close filters label (mobile)", name: "filters_close_label", widget: "string"}
                  - {label: "Show results button (mobile)", name: "show_results", widget: "string", hint: "Use {shown}"}
                  - {label: "Empty state", name: "empty_state", widget: "string"}
                  - {label: "Non-classified teams separator", name: "declassified_separator", widget: "string"}
                  - {label: "Under construction note", name: "under_construction", widget: "string", hint: "Shown at the end of the team list"}
                  - {label: "Beginner tag", name: "beginner_tag", widget: "string"}
                  - {label: "Operatives label", name: "operatives_label", widget: "string"}
                  - {label: "Boxes label", name: "boxes_label", widget: "string"}
                  - {label: "Combat label", name: "combat_label", widget: "string"}
                  - {label: "Ranged icon label", name: "ranged_label", widget: "string"}
                  - {label: "Melee icon label", name: "melee_label", widget: "string"}
                  - {label: "Tier label", name: "tier_label", widget: "string"}
                  - {label: "Legal until label", name: "legal_until_label", widget: "string", hint: "Use {month} and {year} placeholders"}
                  - {label: "Rotates soon label", name: "rotates_soon_label", widget: "string"}
                  - {label: "Not tournament legal label", name: "not_legal_label", widget: "string"}
                  - {label: "Close button label", name: "close_label", widget: "string"}
